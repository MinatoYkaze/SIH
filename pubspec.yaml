name: transition_platform
description: A civic tech movement platform connecting citizens, students, and industrialists.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  supabase_flutter: ^2.8.0
  http: ^1.2.2
  image_picker: ^1.1.2
  geolocator: ^13.0.1
  google_maps_flutter: ^2.10.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # To add assets (like the specific screenshots or icons later), 
  # uncomment the section below and add your file paths:
  # assets:
  #   - assets/images/